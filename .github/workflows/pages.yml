name: Deploy Ube Customizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/customizer*"
      - "src/character/**"
      - "src/config/**"
      - "src/contributions/**"
      - "src/experience/**"
      - "src/render/**"
      - "scripts/build.mjs"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
